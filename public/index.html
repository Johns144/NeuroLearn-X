<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the layout use env(safe-area-inset-*) around an iPhone's notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NeuroLearn-X</title>
  <meta name="description" content="Adaptive learning pathways for Senior High School learners and their teachers.">
  <meta name="theme-color" content="#2a6fdb">
  <meta name="color-scheme" content="light">
  <meta name="format-detection" content="telephone=no">
  <!-- Add to Home Screen: Android reads the manifest, iPhone the apple-* tags -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="NeuroLearn">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="boot" id="boot">Loading NeuroLearn-X…</div>

  <!-- Sign in, registration and first-run setup -->
  <div class="auth" id="auth" hidden>
    <canvas class="auth-mesh" id="authMesh" aria-hidden="true"></canvas>
    <div class="auth-glow" aria-hidden="true"></div>
    <section class="auth-hero">
      <div class="brand light">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#fff"/><g fill="#2a6fdb" stroke="#2a6fdb"><circle cx="10" cy="10" r="2.6"/><circle cx="22" cy="11" r="2.6"/><circle cx="13" cy="22" r="2.6"/><circle cx="23" cy="22" r="2.2"/><path d="M10 10 L22 11 L13 22 L23 22 M10 10 L13 22" fill="none" stroke-width="1.6"/></g></svg>
        <div class="brand-name">NeuroLearn-X</div>
      </div>
      <div class="auth-copy">
        <h1>Learn at the pace <br>that fits you.</h1>
      </div>
      <!-- Decorative preview of the student dashboard -->
      <div class="preview" aria-hidden="true">
        <div class="pv-card pv-main">
          <div class="pv-head"><span class="pv-dot"></span><b>My path</b><span class="pv-pill">Adaptive</span></div>
          <div class="pv-steps">
            <div class="pv-step done"><i></i><span>Functions</span></div>
            <div class="pv-step now"><i></i><span>Limits</span></div>
            <div class="pv-step"><i></i><span>Derivatives</span></div>
          </div>
          <div class="pv-bars">
            <div class="pv-bar"><span>Pre-Calculus</span><div><i style="--w:86%"></i></div></div>
            <div class="pv-bar"><span>Gen. Chemistry</span><div><i style="--w:64%"></i></div></div>
            <div class="pv-bar"><span>Gen. Physics</span><div><i style="--w:42%"></i></div></div>
          </div>
        </div>
        <div class="pv-card pv-gauge">
          <svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="24" class="trk"/><circle cx="30" cy="30" r="24" class="val"/></svg>
          <div><small>Cognitive load</small><b>Just right</b></div>
        </div>
        <div class="pv-card pv-gain">
          <svg viewBox="0 0 80 28"><polyline points="2,24 16,20 30,22 44,13 58,11 78,4"/></svg>
          <b>+18%</b>
        </div>
      </div>
    </section>
    <section class="auth-panel">
      <div class="auth-card" id="authCard"></div>
    </section>
  </div>

  <!-- Signed-in application -->
  <div class="app" id="app" hidden>
    <aside class="sidebar" aria-label="Main navigation">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9"/>
          <g fill="#fff" stroke="#fff">
            <circle cx="10" cy="10" r="2.6"/><circle cx="22" cy="11" r="2.6"/><circle cx="13" cy="22" r="2.6"/><circle cx="23" cy="22" r="2.2"/>
            <path d="M10 10 L22 11 L13 22 L23 22 M10 10 L13 22" fill="none" stroke-width="1.6"/>
          </g>
        </svg>
        <div>
          <div class="brand-name">NeuroLearn-X</div>
          <div class="brand-sub" id="roleLabel">Adaptive learning</div>
        </div>
      </div>
      <nav class="side-nav" id="sideNav"></nav>
      <div class="more-backdrop" id="moreBackdrop" hidden></div>
      <nav class="more-sheet" id="moreSheet" aria-label="More pages" hidden></nav>
      <div class="side-card" id="sideCard"></div>
      <div class="side-user" id="sideUser"></div>
    </aside>

    <div class="app-main">
      <header class="appbar">
        <div class="page-title">
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSub"></p>
        </div>
        <div class="appbar-controls" id="appbarControls">
          <label class="learner-picker" id="learnerPicker" hidden>
            <span>Learner</span>
            <select id="learnerSelect" aria-label="Selected learner"></select>
          </label>
          <div class="menu" id="dataMenuWrap" hidden>
            <button class="btn icon-btn" id="dataMenuBtn" type="button" aria-haspopup="true" aria-expanded="false" title="Export data" aria-label="Export data"></button>
            <div class="menu-list" id="dataMenu" hidden>
              <button type="button" data-action="export-json">Export all data (JSON)</button>
              <button type="button" data-action="export-attempts">Export attempts (CSV)</button>
              <button type="button" data-action="export-outcomes">Export outcomes (CSV)</button>
            </div>
          </div>
          <button class="btn icon-btn mobile-only" id="mobileLogout" type="button" title="Sign out" aria-label="Sign out"></button>
        </div>
      </header>
      <main id="panel" tabindex="-1"></main>
    </div>
  </div>

  <dialog id="dialog"><div id="dialogBody"></div></dialog>
  <div class="tooltip" id="tooltip" role="status" hidden></div>

  <script src="vendor/katex/katex.min.js"></script>
  <script src="js/mathtext.js"></script>
  <script src="js/curriculum.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/mesh.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
